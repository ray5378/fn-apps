<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>虚拟机管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-content">
        <h1>虚拟机管理</h1>
        <span class="subtitle">fnOS VM Manager</span>
      </div>
    </header>

    <main>
      <section id="patch-section" class="card">
        <div class="card-header">
          <h2>手机端增强</h2>
          <span class="badge">VM Patch</span>
        </div>
        <div class="card-body">
          <div class="toggle-row">
            <div class="toggle-info">
              <span class="toggle-label">开启 VM 手机端导入/创建及 VNC 访问</span>
              <span id="patch-status-text" class="status-text">检查中...</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="patch-toggle" />
              <span class="slider round"></span>
            </label>
          </div>
          <p class="hint">强制开启虚拟机在手机端的功能按钮显示。虚拟机升级或重装后需重新应用。</p>
        </div>
      </section>

      <section id="vms-section" class="card">
        <div class="card-header">
          <h2>虚拟机列表</h2>
          <span id="vm-count" class="badge">0</span>
        </div>
        <div class="card-body" id="vms-container">
          <div class="loading">加载中...</div>
        </div>
      </section>
    </main>

    <footer>
      <p>fn-trim.vm v2.0.1</p>
    </footer>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    const API_BASE = 'api';

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + (type || 'info') + ' show';
      clearTimeout(t._hide);
      t._hide = setTimeout(() => { t.className = 'toast hidden'; }, 3000);
    }

    async function apiFetch(path, opts) {
      const url = API_BASE + '/' + path;
      try {
        const res = await fetch(url, opts);
        return await res.json();
      } catch (e) {
        showToast('网络错误: ' + e.message, 'error');
        return null;
      }
    }

    function vmStatusIcon(state) {
      switch (state) {
        case 'running': return '<span class="status-dot green"></span> 运行中';
        case 'shut_off': return '<span class="status-dot gray"></span> 已关机';
        case 'paused': return '<span class="status-dot yellow"></span> 已暂停';
        default: return '<span class="status-dot gray"></span> ' + state;
      }
    }

    function formatMemory(kb) {
      if (!kb || kb === '0') return '-';
      const mb = parseInt(kb) / 1024;
      if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
      return Math.round(mb) + ' MB';
    }

    function renderVMs(vms) {
      const container = document.getElementById('vms-container');
      document.getElementById('vm-count').textContent = vms.length;

      if (!vms || vms.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无虚拟机</div>';
        return;
      }

      let html = '';
      vms.forEach(vm => {
        const isRunning = vm.state === 'running';
        html += '<div class="vm-card">';
        html += '<div class="vm-top">';
        html += '<div class="vm-name-row">';
        const vmDisplayName = vm.displayName && vm.displayName !== vm.name ? vm.displayName : null;
        html += '<span class="vm-name">' + escapeHtml(vmDisplayName || vm.name) + '</span>';
        if (vmDisplayName) {
          html += '<span class="vm-name-sub">' + escapeHtml(vm.name) + '</span>';
        }
        html += vmStatusIcon(vm.state);
        html += '</div>';
        html += '</div>';
        html += '<div class="vm-info">';
        html += '<span class="vm-info-item">CPU: ' + (vm.vcpu || '-') + ' 核</span>';
        html += '<span class="vm-info-item">内存: ' + formatMemory(vm.memory) + '</span>';
        html += '</div>';

        const actions = [];
        if (isRunning) {
          actions.push({ action: 'shutdown', label: '关机', cls: 'btn-warning', icon: '⏻' });
          actions.push({ action: 'reboot', label: '重启', cls: 'btn-info', icon: '⟳' });
          actions.push({ action: 'destroy', label: '强制停止', cls: 'btn-danger', icon: '⏹' });
        } else {
          actions.push({ action: 'start', label: '启动', cls: 'btn-success', icon: '▶' });
        }

        html += '<div class="vm-actions">';
        actions.forEach(a => {
          html += '<button class="btn ' + a.cls + '" data-vm="' + escapeHtml(vm.name) + '" data-action="' + a.action + '">';
          html += a.icon + ' ' + a.label;
          html += '</button>';
        });
        html += '</div></div>';
      });
      container.innerHTML = html;

      container.querySelectorAll('button[data-vm][data-action]').forEach(btn => {
        btn.addEventListener('click', async function() {
          const vmName = this.dataset.vm;
          const action = this.dataset.action;
          this.disabled = true;
          this.textContent = '处理中...';

          const result = await apiFetch('vm/' + encodeURIComponent(vmName) + '/' + action, { method: 'POST' });
          if (result && result.success) {
            showToast(vmName + ' ' + getActionLabel(action) + ' 成功', 'success');
          } else if (result && result.error) {
            showToast(result.error, 'error');
          }
          this.disabled = false;
          loadVMs();
        });
      });
    }

    function getActionLabel(a) {
      const map = { start: '启动', shutdown: '关机', destroy: '强制停止', reboot: '重启', reset: '重置' };
      return map[a] || a;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    async function loadVMs() {
      const data = await apiFetch('vms');
      if (data) renderVMs(data);
    }

    async function loadPatchStatus() {
      const data = await apiFetch('patch');
      const toggle = document.getElementById('patch-toggle');
      const statusText = document.getElementById('patch-status-text');
      if (!data) {
        statusText.textContent = '获取状态失败';
        statusText.className = 'status-text status-off';
        return;
      }
      toggle.checked = data.patched;
      statusText.textContent = data.patched ? '已开启 ✓' : '已关闭 ✗';
      statusText.className = 'status-text ' + (data.patched ? 'status-on' : 'status-off');
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadVMs();
      loadPatchStatus();

      document.getElementById('patch-toggle').addEventListener('change', async function() {
        const enable = this.checked;
        const statusText = document.getElementById('patch-status-text');
        statusText.textContent = '处理中...';

        const data = await apiFetch('patch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: enable })
        });

        if (data && data.success !== undefined) {
          loadPatchStatus();
          if (data.success) {
            showToast(enable ? '补丁已应用' : '补丁已移除', 'success');
          }
        } else {
          loadPatchStatus();
        }
      });

      setInterval(loadVMs, 5000);
    });
  </script>
</body>
</html>
